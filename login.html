<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - War Laundry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
      display: flex;
      align-items: center;
    }
    .login-card { border: 0; border-radius: 1rem; overflow: hidden; }
    .brand-panel {
      background: #0b5ed7;
      color: #fff;
    }
    .brand-icon { font-size: 4rem; }
    .role-option { cursor: pointer; }
    .btn-check:checked + .role-option {
      background-color: #0d6efd;
      color: #fff;
      border-color: #0d6efd;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-9 col-xl-8">
        <div class="card login-card shadow-lg">
          <div class="row g-0">

            <!-- Panel merek -->
            <div class="col-md-5 brand-panel d-flex flex-column justify-content-center align-items-center text-center p-4">
              <i class="bi bi-droplet-half brand-icon mb-2"></i>
              <h3 class="fw-bold mb-1">War Laundry</h3>
              <p class="mb-0 small opacity-75">Aplikasi Manajemen Laundry<br></p>
            </div>

            <!-- Form login -->
            <div class="col-md-7 bg-white p-4 p-md-5">
              <h4 class="fw-bold mb-1">Selamat Datang</h4>
              <p class="text-muted mb-4">Silakan masuk untuk melanjutkan.</p>

              <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

              <form id="loginForm" novalidate>
                <!-- Pilih peran -->
                <label class="form-label fw-semibold">Masuk sebagai <span class="text-danger">*</span></label>
                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <input type="radio" class="btn-check" name="role" id="rolePemilik" value="pemilik" checked>
                    <label class="btn btn-outline-primary w-100 role-option py-2" for="rolePemilik">
                      <i class="bi bi-person-badge d-block fs-4"></i> Pemilik
                    </label>
                  </div>
                  <div class="col-6">
                    <input type="radio" class="btn-check" name="role" id="rolePetugas" value="petugas">
                    <label class="btn btn-outline-primary w-100 role-option py-2" for="rolePetugas">
                      <i class="bi bi-person-workspace d-block fs-4"></i> Petugas
                    </label>
                  </div>
                </div>

                <!-- Username -->
                <div class="mb-3">
                  <label for="username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                  <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan username" required autocomplete="username">
                    <div class="invalid-feedback">Username wajib diisi.</div>
                  </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                  <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan password" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Tampilkan password">
                      <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                    <div class="invalid-feedback">Password wajib diisi.</div>
                  </div>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="remember">
                  <label class="form-check-label" for="remember">Ingat saya</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                  <i class="bi bi-box-arrow-in-right me-1"></i> Masuk
                </button>
              </form>

              
            </div>
          </div>
        </div>
        <p class="text-center text-white-50 small mt-3 mb-0">&copy; 2026 War Laundry</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Data akun uji untuk prototipe (ganti dengan autentikasi ke database/server pada versi final)
    const akun = [
      { username: 'pemilik', password: 'pemilik123', role: 'pemilik', nama: 'Pemilik Laundry', tujuan: 'dashboard.html' },
      { username: 'petugas', password: 'petugas123', role: 'petugas', nama: 'Petugas Laundry', tujuan: 'dashboard.html' } 
    ];

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const pwd = document.getElementById('password');

    // Tampilkan/sembunyikan password
    document.getElementById('togglePassword').addEventListener('click', () => {
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      document.getElementById('toggleIcon').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');

      // Validasi field wajib
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      const role = form.querySelector('input[name="role"]:checked').value;
      const user = document.getElementById('username').value.trim();
      const pass = pwd.value;

      const ditemukan = akun.find(a => a.username === user && a.password === pass && a.role === role);

      if (!ditemukan) {
        alertBox.textContent = 'Login gagal: username, password, atau peran tidak sesuai.';
        alertBox.classList.remove('d-none');
        return;
      }

      // Simpan sesi sederhana (hanya untuk prototipe)
      const storage = document.getElementById('remember').checked ? localStorage : sessionStorage;
      storage.setItem('sesi', JSON.stringify({ username: ditemukan.username, role: ditemukan.role, nama: ditemukan.nama }));

      alertBox.className = 'alert alert-success';
      alertBox.textContent = 'Login berhasil! Mengalihkan ke dashboard...';
      setTimeout(() => { window.location.href = ditemukan.tujuan; }, 800);
    });
  </script>
</body>
</html>
